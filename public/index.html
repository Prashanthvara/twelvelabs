<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Search with TwelveLabs</title>
    <meta name="description" content="Plain-English search inside video. Ranked clips with timestamps and transcripts, built on TwelveLabs Marengo 3.0 and Cloudflare Workers." />
    <link rel="icon" href="/favicon.ico" />
    <meta property="og:title" content="Video Search with TwelveLabs" />
    <meta property="og:description" content="Plain-English search inside video. Ranked clips with timestamps and transcripts, built on TwelveLabs Marengo 3.0 and Cloudflare Workers." />
    <meta property="og:url" content="https://twelvelabs.pjayav.workers.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://twelvelabs.pjayav.workers.dev/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Video Search: find the moment, not just the video. Ranked clips with timestamps." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Video Search with TwelveLabs" />
    <meta name="twitter:description" content="Plain-English search inside video. Ranked clips with timestamps and transcripts, built on TwelveLabs Marengo 3.0 and Cloudflare Workers." />
    <meta name="twitter:image" content="https://twelvelabs.pjayav.workers.dev/og-card.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/styles.css?v=final-v1" />
</head>

<body>
    <div class="app-container">

        <!-- Hero Section (Moved out of main for full width) -->
        <section class="hero-section">
            <div class="hero-content">
                <h2>Unlock the Power of Video Analysis</h2>
                <p>Search, analyze, and extract insights from your video content with AI technology powered by
                    TwelveLabs.</p>
            </div>
        </section>

            <!-- Video Grid / Sidebar -->
        <section class="sidebar" id="video-library-pane">
            <div class="sidebar-content">
                <div class="sidebar-header">
                    <h2>Video Library</h2>
                    <button id="index-video-btn" class="icon-btn"><i class="fas fa-plus"></i></button>
                </div>
                <div id="video-list" class="video-list" role="listbox" aria-label="Select a video to analyze">
                    <!-- Video items will be injected here -->
                </div>
            </div>
        </section>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content-pane">

            <!-- Back Button (Mobile) -->
            <button id="back-to-videos" class="back-button" style="display: none;">
                <i class="fas fa-arrow-left"></i> Back to Videos
            </button>

            <!-- Search Section (moved to top) -->
            <section class="search-section" aria-label="Search videos">
                <div class="search-header">
                    <h2>Search</h2>
                </div>
                <div class="search-controls">
                    <input type="text" id="search-input" placeholder="Search in this video..." aria-label="Search in this video" />
                    <button id="search-btn" class="primary-btn">Search</button>
                </div>
            </section>

            <!-- Video Player -->
            <div id="video-player-container" aria-label="Video Player Region" role="region">
                <!-- Video player will be embedded here -->
            </div>

            <!-- Video Details -->
            <div id="video-details-container" aria-live="polite">
                <!-- Video metadata will be shown here -->
            </div>

            <!-- Search Results -->
            <div id="search-results-container" aria-label="Search results" aria-live="polite">
                <!-- Search results will be displayed here -->
            </div>
        </main>
    </div>

    <!-- Indexing Modal -->
    <div id="indexing-modal" class="modal" role="dialog" aria-labelledby="indexing-modal-title">
        <div class="modal-content">
            <span class="close-btn" aria-label="Close dialog">&times;</span>
            <h3 id="indexing-modal-title">Index a New Video</h3>
            <input type="text" id="video-url-input" placeholder="Enter video URL" />
            <button id="submit-indexing-btn" class="primary-btn">Index Video</button>
            <div id="indexing-status"></div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
